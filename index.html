<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ART COMPASS — Art Experience Chat</title>
  <meta name="description" content="対話から、今のあなたに合うアート体験を提案します。" />
  <style>
    :root{
      --paper:#f3f0e9;
      --ink:#11110f;
      --muted:#77736c;
      --hair:rgba(17,17,15,.13);
      --glass:rgba(247,244,237,.72);
      --deep:#171713;
      --radius:28px;
      --ease:cubic-bezier(.22,.8,.24,1);
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      color:var(--ink);
      background:var(--paper);
      font-family:
        "Helvetica Neue",
        "Hiragino Sans",
        "Yu Gothic",
        "Noto Sans JP",
        sans-serif;
      overflow:hidden;
    }

    button,textarea{font:inherit}
    button{color:inherit}

    .shell{
      height:100dvh;
      display:grid;
      grid-template-columns:minmax(280px,34vw) minmax(0,1fr);
      overflow:hidden;
      background:
        radial-gradient(circle at 76% 4%, rgba(255,255,255,.72), transparent 26%),
        var(--paper);
    }

    /* ---------- left sensory panel ---------- */
    .sensor{
      position:relative;
      overflow:hidden;
      min-height:0;
      border-right:1px solid var(--hair);
      background:#171713;
      color:#f5f2e9;
      padding:30px;
      display:flex;
      flex-direction:column;
      isolation:isolate;
    }

    .sensor::before{
      content:"";
      position:absolute;
      inset:-20%;
      background:
        radial-gradient(circle at 32% 28%, rgba(214,238,255,.72) 0 4%, transparent 21%),
        radial-gradient(circle at 68% 58%, rgba(255,175,143,.78) 0 5%, transparent 28%),
        radial-gradient(circle at 44% 76%, rgba(172,153,255,.62) 0 5%, transparent 26%),
        radial-gradient(circle at 76% 20%, rgba(227,255,175,.32) 0 4%, transparent 24%);
      filter:blur(10px);
      transform:scale(1.18);
      animation:drift 17s ease-in-out infinite alternate;
      z-index:-2;
    }

    .sensor::after{
      content:"";
      position:absolute;
      inset:0;
      opacity:.11;
      z-index:-1;
      background-image:
        linear-gradient(rgba(255,255,255,.25) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.25) 1px,transparent 1px);
      background-size:42px 42px;
      mask-image:linear-gradient(to bottom,black,transparent 76%);
    }

    @keyframes drift{
      0%{transform:translate(-3%,-2%) scale(1.12) rotate(-2deg)}
      50%{transform:translate(4%,3%) scale(1.24) rotate(3deg)}
      100%{transform:translate(-1%,6%) scale(1.17) rotate(-1deg)}
    }

    .brand{
      position:relative;
      z-index:2;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:20px;
    }

    .brand-name{
      font-size:12px;
      letter-spacing:.18em;
      font-weight:700;
    }

    .brand-no{
      font-size:11px;
      opacity:.55;
      font-variant-numeric:tabular-nums;
    }

    .sensor-center{
      position:relative;
      z-index:2;
      flex:1;
      display:grid;
      place-items:center;
      padding:30px 0;
    }

    .orb-wrap{
      position:relative;
      width:min(25vw,330px);
      aspect-ratio:1;
      display:grid;
      place-items:center;
    }

    .orb{
      width:74%;
      aspect-ratio:1;
      border-radius:50%;
      position:relative;
      background:
        radial-gradient(circle at 34% 27%, rgba(255,255,255,.92), rgba(239,231,190,.5) 13%, rgba(221,154,142,.7) 35%, rgba(95,73,173,.76) 68%, rgba(20,18,15,.1) 76%);
      box-shadow:
        0 0 85px rgba(196,174,255,.2),
        0 0 0 1px rgba(255,255,255,.18) inset;
      animation:breathe 7s var(--ease) infinite alternate;
    }

    .orb::before,
    .orb::after{
      content:"";
      position:absolute;
      inset:-14%;
      border:1px solid rgba(255,255,255,.18);
      border-radius:45% 55% 60% 40% / 44% 42% 58% 56%;
      animation:orbit 13s linear infinite;
    }

    .orb::after{
      inset:-28%;
      opacity:.5;
      animation-duration:19s;
      animation-direction:reverse;
    }

    @keyframes breathe{
      from{transform:scale(.96);filter:saturate(.94)}
      to{transform:scale(1.055);filter:saturate(1.08)}
    }
    @keyframes orbit{to{transform:rotate(360deg)}}

    .sensor-caption{
      text-align:center;
      margin-top:22px;
      font-size:12px;
      line-height:1.8;
      opacity:.72;
      letter-spacing:.04em;
    }

    .sensor-bottom{
      position:relative;
      z-index:2;
      display:grid;
      gap:12px;
    }

    .mode-line{
      display:flex;
      align-items:center;
      gap:12px;
      font-size:11px;
      letter-spacing:.08em;
    }

    .mode-dot{
      width:7px;height:7px;border-radius:50%;
      background:#c8ffa1;
      box-shadow:0 0 12px rgba(200,255,161,.55);
    }

    .reset{
      border:1px solid rgba(255,255,255,.26);
      background:rgba(0,0,0,.16);
      color:#fff;
      padding:12px 14px;
      border-radius:999px;
      cursor:pointer;
      transition:.2s var(--ease);
      font-size:12px;
      letter-spacing:.05em;
      backdrop-filter:blur(10px);
    }
    .reset:hover{background:rgba(255,255,255,.1)}

    /* ---------- conversation side ---------- */
    .stage{
      min-width:0;
      min-height:0;
      height:100%;
      display:grid;
      grid-template-rows:auto minmax(0,1fr) auto;
      overflow:hidden;
    }

    .stage-head{
      padding:25px clamp(22px,4vw,56px) 18px;
      display:flex;
      justify-content:space-between;
      gap:20px;
      align-items:flex-start;
      border-bottom:1px solid var(--hair);
    }

    .eyebrow{
      font-size:10px;
      letter-spacing:.16em;
      color:var(--muted);
      margin-bottom:8px;
      text-transform:uppercase;
    }

    .stage-title{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(23px,2.7vw,39px);
      font-weight:400;
      line-height:1.05;
      letter-spacing:-.025em;
    }

    .time-state{
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--muted);
      font-size:11px;
      white-space:nowrap;
      margin-top:5px;
    }
    .time-state i{
      width:7px;height:7px;border-radius:50%;background:#3aa963;
    }

    #messages{
      min-height:0;
      overflow-y:auto;
      scroll-behavior:smooth;
      overscroll-behavior:contain;
      padding:34px clamp(22px,5vw,72px) 60px;
    }

    #messages::-webkit-scrollbar{width:8px}
    #messages::-webkit-scrollbar-thumb{
      background:rgba(17,17,15,.16);
      border:2px solid transparent;
      background-clip:padding-box;
      border-radius:20px;
    }

    .row{
      display:grid;
      margin:0 0 34px;
      animation:enter .42s var(--ease) both;
    }
    @keyframes enter{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:none}
    }

    .row.assistant{justify-items:start}
    .row.user{justify-items:end}

    .avatar{display:none}

    .bubble{
      max-width:min(760px,92%);
      line-height:1.85;
      font-size:15px;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .assistant .bubble{
      padding:0;
      background:none;
      border:0;
    }

    .assistant .bubble::before{
      content:"AI / ART COMPASS";
      display:block;
      font-size:9px;
      letter-spacing:.15em;
      color:var(--muted);
      margin-bottom:11px;
    }

    .user .bubble{
      background:var(--deep);
      color:#f7f4ec;
      padding:14px 18px;
      border-radius:22px 22px 5px 22px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
      max-width:min(620px,88%);
    }

    /* ---------- assistant rich content ---------- */
    .answer-content{white-space:normal}
    .answer-content h2{
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(24px,2.4vw,34px);
      font-weight:400;
      line-height:1.25;
      margin:8px 0 28px;
      letter-spacing:-.02em;
    }

    .answer-content h3{
      margin:38px 0 14px;
      padding-top:20px;
      border-top:1px solid var(--hair);
      font-size:19px;
      line-height:1.55;
      font-weight:600;
    }

    .answer-content p{
      margin:0 0 12px;
      max-width:680px;
    }

    .answer-content ul,.answer-content ol{
      margin:10px 0 18px;
      padding-left:1.3em;
    }
    .answer-content li{margin:6px 0}
    .answer-content strong{font-weight:650}
    .answer-content a{
      color:inherit;
      text-decoration:none;
      border-bottom:1px solid rgba(17,17,15,.4);
    }

    .answer-content .category-label{
      display:inline-flex;
      align-items:center;
      gap:7px;
      font-size:10px;
      line-height:1;
      letter-spacing:.12em;
      border:1px solid var(--hair);
      border-radius:999px;
      padding:7px 10px;
      margin-right:7px;
      vertical-align:2px;
      background:rgba(255,255,255,.45);
      color:#555149;
      font-weight:700;
    }

    .answer-content hr{
      border:0;
      border-top:1px solid var(--hair);
      margin:28px 0;
    }

    .sources{
      margin-top:30px;
      padding-top:16px;
      border-top:1px solid var(--hair);
      display:grid;
      gap:8px;
      max-width:680px;
    }
    .sources-label{
      font-size:9px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--muted);
      font-weight:700;
      margin-bottom:4px;
    }
    .source{
      color:var(--ink);
      text-decoration:none;
      font-size:12px;
      line-height:1.5;
    }
    .source:hover{text-decoration:underline}

    .typing{
      display:inline-flex;
      gap:5px;
      padding:8px 0;
    }
    .typing i{
      width:6px;height:6px;border-radius:50%;
      background:#77736c;
      animation:pulse 1s infinite;
    }
    .typing i:nth-child(2){animation-delay:.14s}
    .typing i:nth-child(3){animation-delay:.28s}
    @keyframes pulse{
      0%,100%{opacity:.22;transform:translateY(0)}
      50%{opacity:1;transform:translateY(-4px)}
    }

    .error{color:#a82b25}

    /* ---------- composer ---------- */
    .composer{
      position:relative;
      padding:12px clamp(22px,5vw,72px) 22px;
      background:
        linear-gradient(to top,var(--paper) 68%,rgba(243,240,233,0));
    }

    .chips{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      margin-bottom:10px;
    }

    .chip{
      border:1px solid var(--hair);
      background:rgba(255,255,255,.38);
      border-radius:999px;
      padding:8px 11px;
      cursor:pointer;
      font-size:11px;
      color:#514e48;
      transition:.2s var(--ease);
    }
    .chip:hover{background:#fff;transform:translateY(-1px)}

    .input-wrap{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:10px;
      align-items:end;
      padding:7px 7px 7px 17px;
      border:1px solid rgba(17,17,15,.19);
      border-radius:24px;
      background:rgba(255,255,255,.62);
      backdrop-filter:blur(18px);
      box-shadow:0 14px 35px rgba(44,39,30,.06);
    }

    textarea{
      border:0;
      outline:0;
      resize:none;
      min-height:46px;
      max-height:130px;
      width:100%;
      padding:12px 0 8px;
      background:transparent;
      color:var(--ink);
      line-height:1.55;
    }
    textarea::placeholder{color:#9a968e}

    .send{
      border:0;
      width:48px;
      height:48px;
      border-radius:50%;
      background:var(--deep);
      color:white;
      cursor:pointer;
      display:grid;
      place-items:center;
      font-size:0;
      transition:.22s var(--ease);
    }
    .send::before{
      content:"↗";
      font-size:20px;
      line-height:1;
    }
    .send:hover{transform:rotate(5deg) scale(1.04)}
    .send:disabled{opacity:.35;cursor:not-allowed;transform:none}

    .hint{
      margin:7px 5px 0;
      color:var(--muted);
      font-size:9px;
      letter-spacing:.05em;
    }

    @media(max-width:850px){
      .shell{
        grid-template-columns:1fr;
        grid-template-rows:150px minmax(0,1fr);
      }
      .sensor{
        border-right:0;
        border-bottom:1px solid rgba(255,255,255,.15);
        padding:18px 20px;
        display:grid;
        grid-template-columns:1fr auto;
        grid-template-rows:auto 1fr;
      }
      .sensor-center{
        position:absolute;
        right:5%;
        top:-30px;
        width:170px;
        height:170px;
        padding:0;
        opacity:.78;
      }
      .orb-wrap{width:150px}
      .sensor-caption{display:none}
      .sensor-bottom{
        align-self:end;
        grid-column:1/2;
        max-width:210px;
      }
      .reset{padding:8px 12px}
      .stage-head{padding:17px 18px 12px}
      .stage-title{font-size:25px}
      #messages{padding:24px 18px 44px}
      .composer{padding:10px 12px 14px}
      .bubble{max-width:96%}
    }

    @media(max-width:520px){
      .shell{grid-template-rows:118px minmax(0,1fr)}
      .sensor{padding:15px 16px}
      .brand-name{font-size:10px}
      .sensor-center{right:-10px;top:-44px;opacity:.64}
      .mode-line{font-size:9px}
      .reset{font-size:10px;width:max-content}
      .stage-head{align-items:center}
      .stage-head .eyebrow{display:none}
      .stage-title{font-size:20px}
      .time-state{font-size:9px}
      .answer-content h2{font-size:25px}
      .answer-content h3{font-size:17px}
      .bubble{font-size:14px}
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sensor">
      <div class="brand">
        <div class="brand-name">ART COMPASS</div>
        <div class="brand-no">EXP. 01</div>
      </div>

      <div class="sensor-center">
        <div>
          <div class="orb-wrap">
            <div class="orb"></div>
          </div>
          <div class="sensor-caption">
            今の感覚から、<br>
            アートとの距離を探します。
          </div>
        </div>
      </div>

      <div class="sensor-bottom">
        <div class="mode-line">
          <span class="mode-dot"></span>
          <span>LIVE / CURRENT MOMENT</span>
        </div>
        <button class="reset" id="resetBtn">↺ 会話を最初から</button>
      </div>
    </aside>

    <main class="stage">
      <header class="stage-head">
        <div>
          <div class="eyebrow">personal art experience navigator</div>
          <h1 class="stage-title">What art fits you, now?</h1>
        </div>
        <div class="time-state">
          <i></i>
          <span>現在時刻を考慮</span>
        </div>
      </header>

      <div id="messages"></div>

      <div class="composer">
        <div class="chips" id="chips">
          <button class="chip" data-text="今日は静かに過ごしたいです">静かに過ごしたい</button>
          <button class="chip" data-text="何か新しい刺激がほしいです">新しい刺激がほしい</button>
          <button class="chip" data-text="何かつくる体験がしたいです">つくりたい</button>
        </div>

        <div class="input-wrap">
          <textarea id="input" rows="1" placeholder="今の気分や、使える時間、いる場所などを自由に話してください。"></textarea>
          <button class="send" id="sendBtn" aria-label="送信">送信</button>
        </div>
        <div class="hint">ENTER TO SEND · SHIFT + ENTER FOR NEW LINE</div>
      </div>
    </main>
  </div>

<script>

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const resetBtn = document.getElementById("resetBtn");
const chipsEl = document.getElementById("chips");

let history = [];
let busy = false;

function esc(s=""){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function safeUrl(url=""){
  try{
    const u = new URL(url);
    return (u.protocol === "https:" || u.protocol === "http:") ? u.href : "#";
  }catch{
    return "#";
  }
}

function inlineMarkdown(text=""){
  let s = esc(text);

  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) => {
    const href = safeUrl(url);
    return href === "#" ? label :
      `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
  });

  s = s.replace(/【(訪れる|身近な場所で行う|つくる)】/g,
    '<span class="category-label">✦ $1</span>');

  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  return s;
}

function renderMarkdown(md=""){
  const lines = String(md).replace(/\r\n/g,"\n").split("\n");
  let html = "";
  let listType = null;

  function closeList(){
    if(listType){
      html += `</${listType}>`;
      listType = null;
    }
  }

  for(const raw of lines){
    const trimmed = raw.trim();

    if(!trimmed){
      closeList();
      continue;
    }

    if(/^---+$/.test(trimmed)){
      closeList();
      html += "<hr>";
      continue;
    }

    let m = trimmed.match(/^###\s+(.+)$/);
    if(m){
      closeList();
      html += `<h3>${inlineMarkdown(m[1])}</h3>`;
      continue;
    }

    m = trimmed.match(/^##\s+(.+)$/);
    if(m){
      closeList();
      html += `<h2>${inlineMarkdown(m[1])}</h2>`;
      continue;
    }

    m = trimmed.match(/^\d+\.\s+(.+)$/);
    if(m){
      if(listType !== "ol"){
        closeList();
        html += "<ol>";
        listType = "ol";
      }
      html += `<li>${inlineMarkdown(m[1])}</li>`;
      continue;
    }

    m = trimmed.match(/^[-*]\s+(.+)$/);
    if(m){
      if(listType !== "ul"){
        closeList();
        html += "<ul>";
        listType = "ul";
      }
      html += `<li>${inlineMarkdown(m[1])}</li>`;
      continue;
    }

    closeList();
    html += `<p>${inlineMarkdown(trimmed)}</p>`;
  }

  closeList();
  return html;
}

function addMessage(role, text, sources=[]){
  const row = document.createElement("div");
  row.className = `row ${role === "user" ? "user" : "assistant"}`;

  if(role !== "user"){
    const av = document.createElement("div");
    av.className = "avatar";
    av.textContent = "✦";
    row.appendChild(av);
  }

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  if(role === "user"){
    bubble.textContent = text;
  }else{
    const content = document.createElement("div");
    content.className = "answer-content";
    content.innerHTML = renderMarkdown(text);
    bubble.appendChild(content);
  }

  if(role !== "user" && sources && sources.length){
    const sourceWrap = document.createElement("div");
    sourceWrap.className = "sources";
    const label = document.createElement("div");
    label.className = "sources-label";
    label.textContent = "出典・公式情報";
    sourceWrap.appendChild(label);

    sources.slice(0,5).forEach((s, i) => {
      const href = safeUrl(s.url);
      if(href === "#") return;
      const a = document.createElement("a");
      a.className = "source";
      a.href = href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = `${i + 1}. ${s.title || new URL(href).hostname}`;
      sourceWrap.appendChild(a);
    });
    bubble.appendChild(sourceWrap);
  }

  row.appendChild(bubble);

  if(role === "user"){
    const av = document.createElement("div");
    av.className = "avatar";
    av.textContent = "☺";
    row.appendChild(av);
  }

  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return row;
}

function addTyping(){
  const row = document.createElement("div");
  row.className = "row assistant";
  row.innerHTML = '<div class="avatar">✦</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return row;
}

function setBusy(v){
  busy = v;
  sendBtn.disabled = v;
  inputEl.disabled = v;
}

async function sendMessage(){
  const text = inputEl.value.trim();
  if(!text || busy) return;

  chipsEl.style.display = "none";
  addMessage("user", text);
  history.push({role:"user", content:text});
  inputEl.value = "";
  inputEl.style.height = "auto";
  setBusy(true);

  const typing = addTyping();

  try{
    const response = await fetch("/api/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        messages: history,
        clientContext: {
          nowISO: new Date().toISOString(),
          localDateTime: new Intl.DateTimeFormat("ja-JP", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false,
            timeZoneName: "short"
          }).format(new Date()),
          timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone || ""
        }
      })
    });

    const data = await response.json().catch(() => ({}));
    typing.remove();

    if(!response.ok){
      throw new Error(data.error || `通信エラー (${response.status})`);
    }

    const answer = data.answer || "応答を取得できませんでした。";
    addMessage("assistant", answer, data.sources || []);
    history.push({role:"assistant", content:answer});
  }catch(err){
    typing.remove();
    const row = addMessage("assistant", "エラーが発生しました：" + err.message);
    row.querySelector(".bubble").classList.add("error");
  }finally{
    setBusy(false);
    inputEl.focus();
  }
}

function start(){
  messagesEl.innerHTML = "";
  history = [];
  chipsEl.style.display = "flex";
  addMessage("assistant",
`こんにちは。今のあなたに合うアート体験を一緒に探します。

まず、今日はどんな気分ですか？
「静かに過ごしたい」「刺激がほしい」「何かつくりたい」など、短い言葉で大丈夫です。`);
}

sendBtn.addEventListener("click", sendMessage);
inputEl.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight,120) + "px";
});
resetBtn.addEventListener("click", start);
chipsEl.addEventListener("click", e => {
  const btn = e.target.closest("[data-text]");
  if(!btn) return;
  inputEl.value = btn.dataset.text;
  sendMessage();
});

start();

</script>
</body>
</html>
