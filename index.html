.logo-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(24vw,320px);aspect-ratio:1;display:grid;place-items:center}
.logo-wrap img{width:100%;height:100%;object-fit:contain;transform:scale(1.2)}
.main{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:26px 36px 18px;border-bottom:1px solid var(--line)}
.kicker{font-size:11px;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
.header h1{font-family:Georgia,"Times New Roman",serif;font-size:38px;font-weight:400;line-height:1;margin:0}
.header-actions{display:flex;gap:10px;align-items:center}
.badge{font-size:10px;letter-spacing:.08em;color:var(--muted)}
.reset{border:1px solid var(--line);background:rgba(255,255,255,.45);border-radius:999px;padding:9px 13px;cursor:pointer}
.messages{min-height:0;overflow:auto;padding:36px clamp(24px,5vw,72px) 60px;scroll-behavior:smooth}
.row{margin:0 0 30px;display:grid}
.row.user{justify-items:end}
.bubble{max-width:760px;line-height:1.8;font-size:15px}
.row.user .bubble{background:#171713;color:white;border-radius:22px 22px 5px 22px;padding:14px 18px;max-width:620px}
.row.assistant .bubble::before{content:"AI / ART COMPASS LOCAL";display:block;font-size:9px;letter-spacing:.14em;color:var(--muted);margin-bottom:10px}
.phase{font-size:9px;letter-spacing:.14em;color:var(--muted);margin-bottom:8px}
.choice-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.choice{border:1px solid var(--line);background:rgba(255,255,255,.55);border-radius:999px;padding:9px 13px;cursor:pointer}
.choice:hover{background:white}
.result-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}
.card{border:1px solid var(--line);background:rgba(255,255,255,.5);border-radius:22px;padding:18px;display:grid;gap:10px;align-content:start}
.type{width:max-content;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:10px;letter-spacing:.08em}
.card h3{margin:0;font-size:18px}
.card p{margin:0;font-size:13px;line-height:1.7}
.meta{border-top:1px solid var(--line);padding-top:10px;margin-top:4px;font-size:11px;color:var(--muted);display:grid;gap:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.action{border:1px solid var(--line);background:#171713;color:white;border-radius:999px;padding:9px 13px;cursor:pointer}
.action.secondary{background:rgba(255,255,255,.55);color:var(--ink)}
.composer{padding:12px clamp(20px,5vw,72px) 20px;background:linear-gradient(to top,var(--paper) 70%,rgba(242,239,232,0))}
.upload-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.upload{border:1px solid var(--line);background:rgba(255,255,255,.5);border-radius:999px;padding:8px 12px;cursor:pointer;font-size:11px}
.hidden{display:none}
.preview{display:none;align-items:center;gap:10px;border:1px solid var(--line);background:rgba(255,255,255,.5);border-radius:16px;padding:8px 10px;margin-bottom:10px}
.preview.active{display:flex}
.preview img{width:54px;height:54px;object-fit:cover;border-radius:10px}
.preview small{color:var(--muted)}
.input-wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.65);border-radius:24px;padding:7px 7px 7px 16px}
textarea{border:0;outline:0;resize:none;background:transparent;min-height:46px;max-height:120px;padding:11px 0;line-height:1.55}
.send{width:48px;height:48px;border:0;border-radius:50%;background:#171713;color:white;cursor:pointer;font-size:20px}
@media(max-width:860px){
  body{overflow:auto}
  .app{height:auto;min-height:100dvh;display:grid;grid-template-columns:1fr;grid-template-rows:150px auto}
  .left{height:150px;border-right:0;border-bottom:1px solid var(--line)}
  .logo-wrap{width:120px}
  .main{min-height:calc(100dvh - 150px)}
  .header{padding:18px}
  .header h1{font-size:28px}
  .messages{padding:24px 18px 50px}
  .result-grid{grid-template-columns:1fr}
  .composer{padding:10px 12px 16px;position:sticky;bottom:0}
}

.detail-panel{
  display:none;
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--line);
}
.detail-panel.open{display:grid;gap:14px}
.detail-block{display:grid;gap:7px}
.detail-block h4{margin:0;font-size:12px}
.detail-block p,.detail-block li{font-size:12px;line-height:1.65}
.detail-block ul{margin:0;padding-left:1.2em}
.detail-btn{
  width:max-content;
  border:1px solid var(--line);
  background:rgba(255,255,255,.75);
  border-radius:999px;
  padding:8px 11px;
  font-size:11px;
  cursor:pointer;
}
.reference-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}
.reference-card{
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  background:#fff;
}
.reference-card img{
  display:block;
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
}
.reference-card span{
  display:block;
  padding:7px 8px;
  font-size:10px;
  color:var(--muted);
}
.note{font-size:10px!important;color:var(--muted)}

</style>
</head>

{title:"光を5つ採集する",desc:"10〜30分歩き、反射、影、透過、照明など『気になった光』だけを5枚撮影します。",tags:{mood:["calm","uncertain"],mode:["view","hybrid"],place:["outdoor","either"],company:["solo","either"],time:["short","medium"]},meta:["屋外","写真","15〜30分"]},
{title:"色の散歩",desc:"今日気になる色を一色決め、街や室内でその色だけを探します。見つけた場所を写真か言葉で3つ記録します。",tags:{mood:["stim","uncertain"],mode:["view","hybrid"],place:["outdoor","indoor","either"],company:["solo","together","either"],time:["short","medium"]},meta:["どこでも","観察","15〜30分"]},
{title:"音の地図をつくる",desc:"5分だけ立ち止まり、近い音・遠い音・繰り返す音を順番にメモし、最後に位置関係を線で描きます。",tags:{mood:["calm","tired"],mode:["view","hybrid"],place:["outdoor","indoor","either"],company:["solo","either"],time:["short","medium"]},meta:["どこでも","聴覚","10〜20分"]}
],
make:[
{title:"3色だけで今日を描く",desc:"今日の気分に近い3色だけを選び、紙やスマホで抽象的な形をつくります。",tags:{mood:["calm","tired","uncertain"],mode:["make","hybrid"],place:["indoor","either"],company:["solo","either"],time:["short","medium"]},meta:["紙またはスマホ","色","15〜30分"]},
{title:"5つの断片でコラージュ",desc:"レシート、包装紙、写真、メモなど身近な5つの断片を選び、意味を決めずに並べ替えて一枚の画面をつくります。",tags:{mood:["stim","uncertain"],mode:["make","hybrid"],place:["indoor","either"],company:["solo","together","either"],time:["medium","long"]},meta:["身近な素材","コラージュ","30〜45分"]},
{title:"一筆の線で記憶を残す",desc:"今日印象に残った出来事を思い出し、ペンを紙から離さず一本の線で描きます。",tags:{mood:["calm","tired"],mode:["make","hybrid"],place:["indoor","either"],company:["solo","either"],time:["short","medium"]},meta:["紙とペン","ドローイング","10〜20分"]}
]
};

const viewingQuestions = [
"まず、成果を見たときに、あなた自身の目が最初に行くところはどこですか？",
"そこには、どんな色・形・線・質感がありますか？ ひとつだけ挙げるなら何でしょう？",
"その特徴は、体験していたときの行為や気分と何かつながっていますか？",
"つくった直後には気づかなかったけれど、今見ると少し意外に感じるところはありますか？",
"この成果を一言で残すとしたら、どんな言葉を置きたいですか？"
];

let phase="questions", qi=0, answers={}, vi=0;

function scrollBottom(){messagesEl.scrollTop=messagesEl.scrollHeight}

function addMessage(role,text,html=false){
  const row=document.createElement("div");
  row.className="row "+role;
  const bubble=document.createElement("div");
  bubble.className="bubble";
  if(html) bubble.innerHTML=text; else bubble.textContent=text;
  row.appendChild(bubble); messagesEl.appendChild(row); scrollBottom();
}

function askQuestion(){
  const q=questions[qi];
  const row=document.createElement("div"); row.className="row assistant";
  const bubble=document.createElement("div"); bubble.className="bubble";
  bubble.innerHTML=`<div class="phase">QUESTION ${qi+1} / ${questions.length}</div><div>${q.q}</div>`;
  const grid=document.createElement("div"); grid.className="choice-grid";
  q.options.forEach(([label,val])=>{
    const b=document.createElement("button"); b.className="choice"; b.textContent=label;
    b.onclick=()=>{answers[q.key]=val;addMessage("user",label);qi++; qi<questions.length?askQuestion():showResults()};
    grid.appendChild(b);
  });
  bubble.appendChild(grid); row.appendChild(bubble); messagesEl.appendChild(row); scrollBottom();
}

function score(x){
  let s=0; const w={mood:3,mode:3,place:2,company:2,time:2};
  for(const k in w) if(x.tags[k]?.includes(answers[k])) s+=w[k];
  return s;
}
function best(arr){return [...arr].sort((a,b)=>score(b)-score(a))[0]}
function why(x){
  const r=[];
  if(x.tags.mood?.includes(answers.mood))r.push("今の気分");
  if(x.tags.mode?.includes(answers.mode))r.push("見る／つくる方向");
  if(x.tags.place?.includes(answers.place))r.push("場所");
  if(x.tags.company?.includes(answers.company))r.push("過ごし方");
  if(x.tags.time?.includes(answers.time))r.push("時間");
  return (r.slice(0,3).join("・")||"回答全体")+"に合いやすい体験です。";
}
function card(type,x,kind){
  const id="detail-"+kind;
  return `<div class="card">
    <span class="type">${type}</span>
    <h3>${x.title}</h3>
    <p>${x.desc}</p>
    <p><strong>なぜ今のあなたに合うか：</strong>${why(x)}</p>
    <div class="meta">${x.meta.map(m=>`<span>${m}</span>`).join("")}</div>
    <button class="detail-btn" data-detail="${id}" data-kind="${kind}">詳しく見る</button>
    <div class="detail-panel" id="${id}"></div>
  </div>`
}

function svgData(svg){
  return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg);
}

function makeReferenceArt(kind,n){
  const sets={
    nearby:[
      ["#f7f1e7","#376a8a","#e2b43c","#d96e55"],
      ["#eee9df","#477b65","#d4ad3e","#77a3c5"],
      ["#f4efe8","#252525","#c06052","#cdb56a"]
    ],
    make:[
      ["#f3eadf","#2d5790","#db6e4b","#e8c745"],
      ["#ece8df","#35563f","#b64d61","#d4a54b"],
      ["#f4f0e7","#1e1e1e","#6f75b5","#d9825f"]
    ]
  };
  const [bg,a,b,c]=(sets[kind]||sets.make)[n%3];

  if(kind==="nearby"){
    return svgData(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600">
      <rect width="600" height="600" fill="${bg}"/>
      <circle cx="${120+n*70}" cy="150" r="90" fill="${a}" opacity=".8"/>
      <rect x="80" y="280" width="${260+n*40}" height="45" rx="20" fill="${b}" opacity=".82"/>
      <path d="M90 470 C180 350 300 510 520 360" fill="none" stroke="${c}" stroke-width="34" stroke-linecap="round"/>
      <circle cx="470" cy="${120+n*80}" r="45" fill="${b}" opacity=".65"/>
    </svg>`);
  }

  return svgData(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600">
    <rect width="600" height="600" fill="${bg}"/>
    <path d="M70 420 Q160 ${180+n*30} 300 330 T530 210" fill="none" stroke="${a}" stroke-width="42" stroke-linecap="round"/>
    <circle cx="${160+n*90}" cy="165" r="70" fill="${b}" opacity=".8"/>
    <rect x="${290-n*25}" y="390" width="190" height="95" rx="28" fill="${c}" opacity=".78"/>
    <path d="M120 510 L230 390 L350 520" fill="none" stroke="${b}" stroke-width="20" stroke-linecap="round"/>
  </svg>`);
}

function detailContent(kind){
  if(kind==="visit"){
    return `<div class="detail-block">
      <h4>具体的な進め方</h4>
      <ul>
        <li>近くの美術館・ギャラリーを1か所選ぶ</li>
        <li>最初の10分は作品名や解説を読まずに見る</li>
        <li>「なぜか気になる」作品を1点だけ選ぶ</li>
        <li>その作品の前で10〜20分過ごす</li>
        <li>最後に「色・形・距離・気分」から1語だけメモする</li>
      </ul>
    </div>
    <div class="detail-block">
      <h4>見るポイント</h4>
      <p>作品そのものだけでなく、作品と自分の距離、周囲の空間、他の鑑賞者との関係も観察してみてください。</p>
    </div>
    <div class="detail-block">
      <h4>具体例</h4>
      <p>抽象画なら「何を表しているか」より最初に目に入る色や方向を見る。写真なら、画面の外側に何が続いていそうか想像する。</p>
      <p class="note">※APIなし版では現在開催中の展覧会や施設情報は自動取得しません。</p>
    </div>`;
  }

  if(kind==="nearby"){
    return `<div class="detail-block">
      <h4>具体的な進め方</h4>
      <ul>
        <li>15〜20分だけ歩く</li>
        <li>テーマを1つだけ決める（光／色／音／影／文字など）</li>
        <li>3〜5個だけ記録する</li>
        <li>最後に、いちばん気になった1つを選ぶ</li>
      </ul>
    </div>
    <div class="detail-block">
      <h4>参考作品例</h4>
      <div class="reference-grid">
        ${[0,1,2].map(i=>`<div class="reference-card"><img src="${makeReferenceArt("nearby",i)}"><span>観察記録 ${i+1}</span></div>`).join("")}
      </div>
      <p class="note">参考画像はブラウザ内で生成しています。完成形の正解ではなく、記録方法の例です。</p>
    </div>`;
  }

  return `<div class="detail-block">
    <h4>具体的な進め方</h4>
    <ul>
      <li>使う素材を3つ以内にする</li>
      <li>10分間は意味を決めずに手を動かす</li>
      <li>途中で「好き／嫌い」を判断しない</li>
      <li>最後に、いちばん気になる部分だけ残す</li>
    </ul>
  </div>
  <div class="detail-block">
    <h4>参考作品例</h4>
    <div class="reference-grid">
      ${[0,1,2].map(i=>`<div class="reference-card"><img src="${makeReferenceArt("make",i)}"><span>参考生成 ${i+1}</span></div>`).join("")}
    </div>
    <p class="note">参考画像は色・形・配置の考え方を示すサンプルとしてブラウザ内で生成します。</p>
  </div>`;
}

function bindDetailButtons(){
  document.querySelectorAll("[data-detail]").forEach(btn=>{
    btn.onclick=()=>{
      const panel=document.getElementById(btn.dataset.detail);
      if(!panel)return;

      if(panel.classList.contains("open")){
        panel.classList.remove("open");
        btn.textContent="詳しく見る";
        return;
      }

      panel.innerHTML=detailContent(btn.dataset.kind);
      panel.classList.add("open");
      btn.textContent="閉じる";
    };
  });
}


function showResults(){
  phase="results";
  addMessage("assistant",`<div class="phase">YOUR ART EXPERIENCE</div><h2>あなたへの3つのアート体験</h2><div class="result-grid">${card("訪れる",best(DB.visit),"visit")}${card("身近な場所で行う",best(DB.nearby),"nearby")}${card("つくる",best(DB.make),"make")}</div><div class="actions"><button class="action" id="toViewing">体験後の対話型鑑賞へ</button><button class="action secondary" id="retry">もう一度選び直す</button></div>`,true);
  setTimeout(()=>{
    bindDetailButtons();
    document.getElementById("toViewing").onclick=()=>{phase="waiting";addMessage("assistant","体験が終わったら「＋ 成果を見せる」から写真や制作物をアップロードしてください。画像なしで言葉だけの振り返りもできます。")};
    document.getElementById("retry").onclick=resetAll;
  },0)
}

function startViewing(){
  phase="viewing";vi=0;
  addMessage("assistant","ここからは、作品を採点したり意味を決めつけたりせず、あなた自身の見方を一緒に探します。");
  addMessage("assistant",viewingQuestions[0]);
}
function handleSend(){
  const t=inputEl.value.trim(); if(!t)return;
  inputEl.value="";
  if(phase==="viewing"){
    addMessage("user",t);vi++;
    if(vi<viewingQuestions.length)addMessage("assistant",viewingQuestions[vi]);
    else{phase="done";addMessage("assistant","ここまでの言葉は、この成果があなたに何を残したかを考える小さな記録になっています。必要なら、もう一度最初から別の体験を探してみてください。")}
  }else if(phase==="waiting"){addMessage("user",t);startViewing()}
  else{addMessage("user",t);addMessage("assistant","このAPIなし版では自由入力の意味理解は限定的です。表示されている選択肢から進めると、より適切に提案できます。")}
}
function resetAll(){
  phase="questions";qi=0;answers={};vi=0;messagesEl.innerHTML="";
  preview.classList.remove("active");fileInput.value="";
  addMessage("assistant","こんにちは。今のあなたに合うアート体験を一緒に探します。\n\nこの版はOpenAI APIを使わず、HTMLだけで動いています。");
  askQuestion();
}

sendBtn.onclick=handleSend;
resetBtn.onclick=resetAll;
inputEl.addEventListener("input",()=>{inputEl.style.height="auto";inputEl.style.height=Math.min(inputEl.scrollHeight,120)+"px"});
fileInput.addEventListener("change",e=>{
  const f=e.target.files?.[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{previewImg.src=r.result;preview.classList.add("active");startViewing()};
  r.readAsDataURL(f);
});

resetAll();
</script>
</body>
</html>
