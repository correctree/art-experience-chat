<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Art Experience Chat</title>
  <meta name="description" content="対話から、あなたに合ったアート体験を提案します。" />
  <style>
    :root{
      --bg:#f3f0ea; --panel:#fff; --ink:#191919; --muted:#6c6b68;
      --line:#e7e2da; --accent:#2256d8; --soft:#f7f6f3;
      --shadow:0 18px 55px rgba(0,0,0,.08);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
      background:
        radial-gradient(circle at 10% 0%,#fff 0,transparent 28%),
        radial-gradient(circle at 90% 0%,#e9efff 0,transparent 28%),
        var(--bg);
      color:var(--ink);
      overflow:hidden;
    }
    button,input,textarea{font:inherit}
    .app{
      height:100dvh;
      display:grid;
      grid-template-columns:290px minmax(0,1fr);
      overflow:hidden;
    }
    aside{
      min-height:0;
      overflow:auto;
      padding:28px 22px;
      border-right:1px solid var(--line);
      background:rgba(255,255,255,.72);
      backdrop-filter:blur(14px);
    }
    .mark{
      width:50px;height:50px;border-radius:15px;display:grid;place-items:center;
      background:linear-gradient(135deg,#2c5ee0,#8458e8);color:#fff;font-size:22px;
      margin-bottom:18px;
    }
    h1{font-size:23px;line-height:1.2;margin:0 0 10px}
    .lead{font-size:14px;line-height:1.7;color:var(--muted);margin:0 0 28px}
    .guide{
      border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px;
      font-size:13px;line-height:1.7;color:var(--muted)
    }
    .guide strong{display:block;color:var(--ink);margin-bottom:6px}
    .status{
      margin-top:18px;padding:12px 14px;border-radius:14px;background:#f9f8f5;
      color:var(--muted);font-size:12px;line-height:1.6
    }
    .reset{
      margin-top:18px;width:100%;border:1px solid var(--line);background:white;
      border-radius:12px;padding:11px;cursor:pointer
    }
    main{
      min-width:0;min-height:0;height:100%;
      display:grid;grid-template-rows:auto minmax(0,1fr) auto;
      overflow:hidden;
    }
    header{
      padding:18px 24px;border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.82);backdrop-filter:blur(12px);
      display:flex;align-items:center;justify-content:space-between;gap:16px
    }
    header .title{font-weight:700}
    header .sub{font-size:12px;color:var(--muted);margin-top:4px}
    .online{
      display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)
    }
    .dot{width:8px;height:8px;border-radius:50%;background:#34a853}
    #messages{
      min-height:0;overflow-y:auto;overscroll-behavior:contain;
      padding:28px max(20px,calc((100% - 840px)/2));
      scroll-behavior:smooth
    }
    .row{display:flex;gap:10px;margin:0 0 18px;align-items:flex-end}
    .row.user{justify-content:flex-end}
    .avatar{
      width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
      display:grid;place-items:center;background:white;flex:0 0 auto;font-size:14px
    }
    .bubble{
      max-width:min(720px,84%);border-radius:18px;padding:14px 16px;
      line-height:1.75;font-size:15px;white-space:pre-wrap;word-break:break-word
    }
    .assistant .bubble{
      background:var(--soft);border:1px solid #ece9e3;border-bottom-left-radius:6px
    }
    .user .bubble{
      background:#202020;color:white;border-bottom-right-radius:6px
    }
    .answer-content{white-space:normal}
    .answer-content h2{font-size:19px;line-height:1.45;margin:8px 0 12px}
    .answer-content h3{font-size:16px;line-height:1.5;margin:18px 0 8px}
    .answer-content p{margin:0 0 11px;line-height:1.8}
    .answer-content ul,.answer-content ol{margin:8px 0 13px;padding-left:1.35em}
    .answer-content li{margin:5px 0;line-height:1.7}
    .answer-content strong{font-weight:700}
    .answer-content a{color:#2854b8;text-decoration:none;border-bottom:1px solid rgba(40,84,184,.3)}
    .answer-content a:hover{border-bottom-color:#2854b8}
    .answer-content hr{border:0;border-top:1px solid #e8e4dc;margin:18px 0}
    .answer-content .category-label{
      display:inline-flex;
      align-items:center;
      gap:6px;
      margin:4px 0 8px;
      padding:5px 9px;
      border-radius:999px;
      background:#f1efe9;
      border:1px solid #e4dfd5;
      font-size:11px;
      font-weight:700;
      letter-spacing:.04em;
      color:#5a5751;
    }
    .sources{
      margin-top:16px;padding-top:13px;border-top:1px solid #e8e4dc;
      display:grid;gap:8px
    }
    .sources-label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.03em}
    .source{
      color:#2854b8;text-decoration:none;font-size:12px;line-height:1.4;
      overflow:hidden;text-overflow:ellipsis
    }
    .source:hover{text-decoration:underline}
    .typing{display:inline-flex;gap:5px}
    .typing i{width:6px;height:6px;background:#999;border-radius:50%;animation:pulse 1s infinite}
    .typing i:nth-child(2){animation-delay:.13s}.typing i:nth-child(3){animation-delay:.26s}
    @keyframes pulse{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
    .error{color:#a32626}
    .composer{
      border-top:1px solid var(--line);background:rgba(255,255,255,.94);
      padding:14px max(18px,calc((100% - 840px)/2)) 18px
    }
    .input-wrap{
      display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;
      background:#fff;border:1px solid #dad6ce;border-radius:18px;
      padding:8px 8px 8px 15px;box-shadow:0 8px 28px rgba(0,0,0,.04)
    }
    textarea{
      width:100%;resize:none;border:0;outline:0;min-height:42px;max-height:120px;
      padding:10px 2px;background:transparent;line-height:1.5
    }
    .send{
      align-self:end;border:0;border-radius:12px;background:#202020;color:#fff;
      min-width:70px;height:42px;padding:0 14px;cursor:pointer
    }
    .send:disabled{opacity:.45;cursor:not-allowed}
    .hint{font-size:11px;color:var(--muted);margin:8px 4px 0}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
    .chip{
      border:1px solid var(--line);background:#fff;border-radius:999px;
      padding:8px 12px;cursor:pointer;font-size:12px
    }
    @media(max-width:760px){
      .app{grid-template-columns:1fr}
      aside{display:none}
      header{padding:14px 16px}
      #messages{padding:20px 14px}
      .composer{padding:10px 12px 14px}
      .bubble{max-width:90%}
    }
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="mark">✦</div>
    <h1>Art Experience Chat</h1>
    <p class="lead">短い対話から、その日のあなたに合う「訪れる・身近に体験する・つくる」の3つのアート体験を提案します。</p>
    <div class="guide">
      <strong>実在情報にも対応</strong>
      地域や日程を伝えると、美術館・展覧会・ワークショップなどの最新情報を必要に応じてWeb検索します。
    </div>
    <div class="status">APIキーはこの画面には保存されません。Vercelの環境変数からサーバー側で利用します。</div>
    <button class="reset" id="resetBtn">会話を最初から</button>
  </aside>

  <main>
    <header>
      <div>
        <div class="title">アート体験コンシェルジュ</div>
        <div class="sub">自由に答えてください。5回前後の対話を目安に提案します。</div>
      </div>
      <div class="online"><span class="dot"></span> OpenAI API・現在時刻を考慮</div>
    </header>

    <div id="messages"></div>

    <div class="composer">
      <div class="chips" id="chips">
        <button class="chip" data-text="東京で探したいです">東京で探す</button>
        <button class="chip" data-text="今日は静かに過ごしたいです">静かに過ごしたい</button>
        <button class="chip" data-text="何か作る体験がしたいです">つくりたい</button>
      </div>
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="例：今日は少し疲れています。小金井周辺で1時間くらい…"></textarea>
        <button class="send" id="sendBtn">送信</button>
      </div>
      <div class="hint">Enterで送信 / Shift + Enterで改行</div>
    </div>
  </main>
</div>

<script>
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const resetBtn = document.getElementById("resetBtn");
const chipsEl = document.getElementById("chips");

let history = [];
let busy = false;

function esc(s=""){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function safeUrl(url=""){
  try{
    const u = new URL(url);
    return (u.protocol === "https:" || u.protocol === "http:") ? u.href : "#";
  }catch{
    return "#";
  }
}

function inlineMarkdown(text=""){
  let s = esc(text);

  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) => {
    const href = safeUrl(url);
    return href === "#" ? label :
      `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
  });

  s = s.replace(/【(訪れる|身近な場所で行う|つくる)】/g,
    '<span class="category-label">✦ $1</span>');

  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  return s;
}

function renderMarkdown(md=""){
  const lines = String(md).replace(/\r\n/g,"\n").split("\n");
  let html = "";
  let listType = null;

  function closeList(){
    if(listType){
      html += `</${listType}>`;
      listType = null;
    }
  }

  for(const raw of lines){
    const trimmed = raw.trim();

    if(!trimmed){
      closeList();
      continue;
    }

    if(/^---+$/.test(trimmed)){
      closeList();
      html += "<hr>";
      continue;
    }

    let m = trimmed.match(/^###\s+(.+)$/);
    if(m){
      closeList();
      html += `<h3>${inlineMarkdown(m[1])}</h3>`;
      continue;
    }

    m = trimmed.match(/^##\s+(.+)$/);
    if(m){
      closeList();
      html += `<h2>${inlineMarkdown(m[1])}</h2>`;
      continue;
    }

    m = trimmed.match(/^\d+\.\s+(.+)$/);
    if(m){
      if(listType !== "ol"){
        closeList();
        html += "<ol>";
        listType = "ol";
      }
      html += `<li>${inlineMarkdown(m[1])}</li>`;
      continue;
    }

    m = trimmed.match(/^[-*]\s+(.+)$/);
    if(m){
      if(listType !== "ul"){
        closeList();
        html += "<ul>";
        listType = "ul";
      }
      html += `<li>${inlineMarkdown(m[1])}</li>`;
      continue;
    }

    closeList();
    html += `<p>${inlineMarkdown(trimmed)}</p>`;
  }

  closeList();
  return html;
}

function addMessage(role, text, sources=[]){
  const row = document.createElement("div");
  row.className = `row ${role === "user" ? "user" : "assistant"}`;

  if(role !== "user"){
    const av = document.createElement("div");
    av.className = "avatar";
    av.textContent = "✦";
    row.appendChild(av);
  }

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  if(role === "user"){
    bubble.textContent = text;
  }else{
    const content = document.createElement("div");
    content.className = "answer-content";
    content.innerHTML = renderMarkdown(text);
    bubble.appendChild(content);
  }

  if(role !== "user" && sources && sources.length){
    const sourceWrap = document.createElement("div");
    sourceWrap.className = "sources";
    const label = document.createElement("div");
    label.className = "sources-label";
    label.textContent = "出典・公式情報";
    sourceWrap.appendChild(label);

    sources.slice(0,5).forEach((s, i) => {
      const href = safeUrl(s.url);
      if(href === "#") return;
      const a = document.createElement("a");
      a.className = "source";
      a.href = href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = `${i + 1}. ${s.title || new URL(href).hostname}`;
      sourceWrap.appendChild(a);
    });
    bubble.appendChild(sourceWrap);
  }

  row.appendChild(bubble);

  if(role === "user"){
    const av = document.createElement("div");
    av.className = "avatar";
    av.textContent = "☺";
    row.appendChild(av);
  }

  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return row;
}

function addTyping(){
  const row = document.createElement("div");
  row.className = "row assistant";
  row.innerHTML = '<div class="avatar">✦</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return row;
}

function setBusy(v){
  busy = v;
  sendBtn.disabled = v;
  inputEl.disabled = v;
}

async function sendMessage(){
  const text = inputEl.value.trim();
  if(!text || busy) return;

  chipsEl.style.display = "none";
  addMessage("user", text);
  history.push({role:"user", content:text});
  inputEl.value = "";
  inputEl.style.height = "auto";
  setBusy(true);

  const typing = addTyping();

  try{
    const response = await fetch("/api/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        messages: history,
        clientContext: {
          nowISO: new Date().toISOString(),
          localDateTime: new Intl.DateTimeFormat("ja-JP", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false,
            timeZoneName: "short"
          }).format(new Date()),
          timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone || ""
        }
      })
    });

    const data = await response.json().catch(() => ({}));
    typing.remove();

    if(!response.ok){
      throw new Error(data.error || `通信エラー (${response.status})`);
    }

    const answer = data.answer || "応答を取得できませんでした。";
    addMessage("assistant", answer, data.sources || []);
    history.push({role:"assistant", content:answer});
  }catch(err){
    typing.remove();
    const row = addMessage("assistant", "エラーが発生しました：" + err.message);
    row.querySelector(".bubble").classList.add("error");
  }finally{
    setBusy(false);
    inputEl.focus();
  }
}

function start(){
  messagesEl.innerHTML = "";
  history = [];
  chipsEl.style.display = "flex";
  addMessage("assistant",
`こんにちは。今のあなたに合うアート体験を一緒に探します。

まず、今日はどんな気分ですか？
「静かに過ごしたい」「刺激がほしい」「何かつくりたい」など、短い言葉で大丈夫です。`);
}

sendBtn.addEventListener("click", sendMessage);
inputEl.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight,120) + "px";
});
resetBtn.addEventListener("click", start);
chipsEl.addEventListener("click", e => {
  const btn = e.target.closest("[data-text]");
  if(!btn) return;
  inputEl.value = btn.dataset.text;
  sendMessage();
});

start();
</script>
</body>
</html>
